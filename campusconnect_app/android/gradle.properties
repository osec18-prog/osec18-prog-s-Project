# Flutter's default asks for -Xmx8G -XX:MaxMetaspaceSize=4G, which the JVM
# cannot reserve on a 16 GB machine that is also running a browser and an
# editor -- the daemon crashes with "insufficient memory ... G1 virtual space".
# This app builds comfortably in 2 GB.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
android.useAndroidX=true
