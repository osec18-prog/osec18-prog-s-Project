<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusConnect+ | Add Professor</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">

</head>

<body>
<div class="dashboard-app">
    <aside class="dashboard-sidebar">
        <div class="sidebar-brand">
            <img src="{{ url_for('static', filename='images/transparentlogo.png') }}" alt="Campus Logo" class="brand-logo">
            <div>
                <h2>Campus Connect +</h2>
                <p>Administrator Panel</p>
            </div>
        </div>
        <nav class="dashboard-nav">
            <a class="nav-link" href="/admin_dashboard">Dashboard</a>
            <a class="nav-link" href="/admin_students">Students</a>
            <a class="nav-link" href="/admin_professors">Professors</a>
            <a class="nav-link" href="/admin_subjects">Subjects</a>
            <a class="nav-link" href="/admin_schedules">Schedules</a>
            <a class="nav-link" href="/generate_qr">Generate QR</a>
            <a class="nav-link" href="/admin_attendance">Attendance</a>
            <a class="nav-link" href="/admin_reports">Reports</a>
            <a class="nav-link" href="/admin_announcements">Announcements</a>
            <a class="nav-link" href="/logout">Logout</a>
        </nav>
    </aside>
    <main class="dashboard-main">
        <div class="section-header">
            <div>
                <h1>Add Professor</h1>
                <p>Create a new professor account.</p>
            </div>
            <div>
                <a href="/admin_professors" class="btn btn-outline-secondary">Back to Professors</a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">

<form action="/add_professor" method="POST" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="col-md-6">
                        <label class="form-label">Employee ID</label>
                        <input type="text" name="employee_id" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="fullname" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Department</label>
                        <select name="department" class="form-select" required>
                            <option value="BSCOMSCIE">BSCOMSCIE</option>
                            <option value="BSBA">BSBA</option>
                            <option value="BEED">BEED</option>
                            <option value="BSED">BSED</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">SAVE PROFESSOR</button>
                    </div>

                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
