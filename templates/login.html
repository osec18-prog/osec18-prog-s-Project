<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CampusConnect+</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-box">

<img src="{{ url_for('static', filename='images/transparentlogo.png') }}" class="logo">

<h1>CampusConnect+</h1>

<h3>AICS Student Portal</h3>

<form action="/login" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

{% if error %}
<div class="error-message">
    {{ error }}
</div>
{% endif %}

<input type="text"
       name="student_id"
       placeholder="Student ID"
       required>

<input type="password"
       name="password"
       placeholder="Password"
       required>

<button type="submit">LOGIN</button>

</form>

<br>

<a href="/signup">Create New Account</a>

<div class="footer">

Capstone Project • Asian Institute of Computer Studies

</div>

</div>

</body>
</html>
