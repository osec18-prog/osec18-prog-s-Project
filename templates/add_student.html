<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect+ | Add Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
<div class="dashboard-app">
    <aside class="dashboard-sidebar">
        <div class="sidebar-brand">
            <img src="{{ url_for('static', filename='images/transparentlogo.png') }}" alt="Campus Logo" class="brand-logo">
            <div>
                <h2>Campus Connect +</h2>
                <p>Administrator Panel</p>
            </div>
        </div>
        <nav class="dashboard-nav">
            <a class="nav-link" href="/admin_dashboard">Dashboard</a>
            <a class="nav-link" href="/admin_students">Students</a>
            <a class="nav-link" href="/admin_professors">Professors</a>
            <a class="nav-link" href="/admin_subjects">Subjects</a>
            <a class="nav-link" href="/admin_schedules">Schedules</a>
            <a class="nav-link" href="/generate_qr">Generate QR</a>
            <a class="nav-link" href="/admin_attendance">Attendance</a>
            <a class="nav-link" href="/admin_reports">Reports</a>
            <a class="nav-link" href="/admin_announcements">Announcements</a>
            <a class="nav-link" href="/logout">Logout</a>
        </nav>
    </aside>
    <main class="dashboard-main">
        <div class="section-header">
            <div>
                <h1>Add Student</h1>
                <p>Create a new student account.</p>
            </div>
            <div>
                <a href="/admin_students" class="btn btn-outline-secondary">Back to Students</a>
            </div>
        </div>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <div class="card">
            <div class="card-body">
                <form action="/add_student" method="POST" class="row g-3">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="col-md-6">
                        <label class="form-label">Student ID</label>
                        <input type="text" name="student_id" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="fullname" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Create Student</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
