<!DOCTYPE html>
<html>

<head>

<title>Scan QR Attendance</title>

<!-- CSRF token for the two fetch() calls below, which change data. -->
<meta name="csrf-token" content="{{ csrf_token() }}">

<script src="https://unpkg.com/html5-qrcode"></script>
<style>
    body {
        font-family: Inter, Arial, Helvetica, sans-serif;
        padding: 24px;
        background: #f7fbff;
        color: #0f2150;
    }
    #status {
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-weight: 700;
    }
    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.5rem 0.85rem;
        border-radius: 999px;
        font-size: 0.95rem;
    }
    .status-online { background: #d1fae5; color: #065f46; }
    .status-offline { background: #fee2e2; color: #991b1b; }
    .status-sync { background: #fef3c7; color: #92400e; }
    #message {
        margin-bottom: 16px;
        padding: 12px 16px;
        border-radius: 16px;
        background: #eef2ff;
        color: #1d4ed8;
        display: none;
        max-width: 620px;
    }
</style>

</head>

<body>

<h1>📷 Scan Attendance QR</h1>
<div id="status"><span class="status-badge status-online" id="networkBadge">🟢 Online</span></div>
<div id="message"></div>
<div id="reader" style="width:500px;"></div>

<script>
// Sent as X-CSRFToken on the two POSTs below; Flask-WTF accepts the token
// from that header as well as from a form field.
const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').content;

const DB_NAME = 'CampusConnectAttendance';
const DB_STORE = 'offlineAttendance';
const DB_VERSION = 1;
let db;

function updateBadge(status) {
    const badge = document.getElementById('networkBadge');
    badge.className = 'status-badge';
    if (status === 'online') {
        badge.classList.add('status-online');
        badge.textContent = '🟢 Online';
    } else if (status === 'offline') {
        badge.classList.add('status-offline');
        badge.textContent = '🔴 Offline';
    } else {
        badge.classList.add('status-sync');
        badge.textContent = '🟡 Syncing...';
    }
}

function showMessage(text, persistent = false) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.style.display = 'block';
    if (!persistent) {
        setTimeout(() => {
            el.style.display = 'none';
        }, 5000);
    }
}

function openDatabase() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = function(event) {
            const database = event.target.result;
            if (!database.objectStoreNames.contains(DB_STORE)) {
                database.createObjectStore(DB_STORE, { keyPath: 'uuid' });
            }
        };
        request.onsuccess = function(event) {
            db = event.target.result;
            resolve(db);
        };
        request.onerror = function(event) {
            reject(event.target.error);
        };
    });
}

function saveOfflineRecord(record) {
    return new Promise((resolve, reject) => {
        if (!db) {
            return reject(new Error('Database unavailable'));
        }
        const tx = db.transaction(DB_STORE, 'readwrite');
        const store = tx.objectStore(DB_STORE);
        store.put(record);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error || new Error('Failed to save record'));
    });
}

function getOfflineRecords() {
    return new Promise((resolve, reject) => {
        if (!db) {
            return resolve([]);
        }
        const tx = db.transaction(DB_STORE, 'readonly');
        const store = tx.objectStore(DB_STORE);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = () => reject(request.error);
    });
}

function deleteOfflineRecord(uuid) {
    return new Promise((resolve, reject) => {
        if (!db) {
            return reject(new Error('Database unavailable'));
        }
        const tx = db.transaction(DB_STORE, 'readwrite');
        const store = tx.objectStore(DB_STORE);
        store.delete(uuid);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error || new Error('Failed to delete record'));
    });
}

async function syncOfflineRecords() {
    if (!navigator.onLine) {
        updateBadge('offline');
        return;
    }
    updateBadge('sync');
    try {
        const records = await getOfflineRecords();
        if (!records.length) {
            updateBadge('online');
            return;
        }
        const response = await fetch('/api/attendance/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
            body: JSON.stringify({ records })
        });
        if (!response.ok) {
            throw new Error('Sync request failed');
        }
        const result = await response.json();
        if (result.results && Array.isArray(result.results)) {
            for (const item of result.results) {
                if (item.status === 'synced' || item.status === 'skipped') {
                    await deleteOfflineRecord(item.uuid);
                }
            }
        }
        updateBadge('online');
        if (records.length) {
            showMessage('Offline records synced successfully.', false);
        }
    } catch (error) {
        updateBadge('offline');
        showMessage('Sync failed. Offline records will retry automatically.', true);
    }
}

function onlineScan(qrText) {
    const payload = {
        uuid: crypto.randomUUID ? crypto.randomUUID() : 'uuid-' + Date.now() + '-' + Math.random().toString(36).slice(2),
        qr: qrText,
        scan_date: new Date().toISOString().slice(0, 10),
        scan_time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
    };
    return fetch('/api/attendance/record', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': CSRF_TOKEN },
        body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showMessage(data.message, true);
        } else {
            showMessage(data.message || 'Attendance failed.', true);
        }
    })
    .catch(() => {
        return saveOffline(qrText);
    });
}

async function saveOffline(qrText) {
    const record = {
        uuid: crypto.randomUUID ? crypto.randomUUID() : 'uuid-' + Date.now() + '-' + Math.random().toString(36).slice(2),
        qr: qrText,
        scan_date: new Date().toISOString().slice(0, 10),
        scan_time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })
    };
    await saveOfflineRecord(record);
    updateBadge('offline');
    showMessage('Attendance saved offline. It will sync automatically when internet becomes available.', true);
}

function onScanSuccess(decodedText) {
    if (navigator.onLine) {
        onlineScan(decodedText);
    } else {
        saveOffline(decodedText);
    }
}

window.addEventListener('online', () => {
    showMessage('Internet connection restored. Syncing offline attendance...', true);
    syncOfflineRecords();
});

window.addEventListener('offline', () => {
    updateBadge('offline');
    showMessage('You are offline. Attendance will save locally.', true);
});

openDatabase().then(() => {
    if (navigator.onLine) {
        syncOfflineRecords();
    } else {
        updateBadge('offline');
    }
});

let scanner = new Html5QrcodeScanner(
    "reader",
    {
        fps: 10,
        qrbox: 250
    }
);

scanner.render(onScanSuccess);
</script>

</body>

</html>
